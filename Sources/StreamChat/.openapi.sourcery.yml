sources:
  - ./Generated/OpenAPI/models/ChannelDetailPayload.swift
  - ./Generated/OpenAPI/models/ChannelStateResponseFields.swift
  - ./Generated/OpenAPI/models/DraftMessagePayload.swift
  - ./Generated/OpenAPI/models/MemberInfoPayload.swift
  - ./Generated/OpenAPI/models/MemberPayload.swift
  - ./Generated/OpenAPI/models/MessageAttachmentPayload.swift
  - ./Generated/OpenAPI/models/MessageReactionPayload.swift
  - ./Generated/OpenAPI/models/MessageResponse.swift
  - ./Generated/OpenAPI/models/OwnUserResponse.swift
  - ./Generated/OpenAPI/models/ThreadParticipantPayload.swift
  - ./Generated/OpenAPI/models/ThreadResponse.swift
  - ./Generated/OpenAPI/models/ThreadStateResponse.swift
  - ./Generated/OpenAPI/models/UserPayload.swift
templates:
  - ./Generated/OpenAPIDecodable.stencil
output:
  ./Generated/OpenAPI/OpenAPIDecoders.generated.swift
args:
  # Models exposing `allKeys`, the wire keys of their stored properties.
  allKeys: [MessageAttachmentPayload]
  # Non-optional properties which fall back to a default when the key is missing or null.
  defaultValues:
    ChannelDetailPayload:
      custom: "[:]"
    ChannelStateResponseFields:
      threads: "[]"
    DraftMessagePayload:
      custom: "[:]"
    MemberInfoPayload:
      notificationsMuted: "false"
    MemberPayload:
      banned: "false"
      channelRole: "\"channel_member\""
      custom: "[:]"
      notificationsMuted: "false"
      shadowBanned: "false"
    MessageAttachmentPayload:
      custom: "[:]"
    MessageReactionPayload:
      custom: "[:]"
    MessageResponse:
      custom: "[:]"
      mentionedChannel: "false"
      mentionedHere: "false"
      pinned: "false"
      reactionCounts: "[:]"
      reactionScores: "[:]"
      restrictedVisibility: "[]"
      shadowed: "false"
      silent: "false"
    OwnUserResponse:
      banned: "false"
      custom: "[:]"
      invisible: "false"
      language: "\"\""
      teams: "[]"
      unreadThreads: "0"
    ThreadParticipantPayload:
      custom: "[:]"
    ThreadResponse:
      activeParticipantCount: "0"
      custom: "[:]"
    ThreadStateResponse:
      latestReplies: "[]"
    UserPayload:
      banned: "false"
      custom: "[:]"
      language: "\"\""
      teams: "[]"
  # Nested models, decoded from the same decoder as the model holding them.
  embedded:
    ThreadStateResponse: thread

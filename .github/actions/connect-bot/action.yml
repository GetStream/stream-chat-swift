name: Connect Bot
description: Lets match read ios-certificates with a release bot token.

inputs:
  client-id:
    description: Release bot app client ID
    required: true
  private-key:
    description: Release bot app private key
    required: true

runs:
  using: composite
  steps:
    - name: Generate bot token
      id: bot-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ios-certificates
        permission-contents: read

    - name: Pass the token to match
      shell: bash
      run: |
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
        # match may print its git command, so mask the encoded token too.
        echo "::add-mask::$auth"
        echo "MATCH_GIT_BASIC_AUTHORIZATION=$auth" >> "$GITHUB_ENV"
      env:
        TOKEN: ${{ steps.bot-token.outputs.token }}

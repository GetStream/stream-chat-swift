name: 'Setup iOS Runtime'
description: 'Reuse or install the requested iOS runtime and simulator'
runs:
  using: "composite"
  steps:
    - name: Setup iOS Simulator Runtime
      shell: bash
      env:
        IOS_VERSION: ${{ inputs.version }}
      run: |
        runtime_id="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
        runtimes=$(xcrun simctl list runtimes --json)
        available=$(jq -r --arg id "$runtime_id" \
          'any(.runtimes[]; .identifier == $id and .isAvailable == true)' <<< "$runtimes")
        if [[ "$available" == true ]]; then
          echo "Reuse iOS $IOS_VERSION runtime."
        else
          bundle exec fastlane install_runtime "ios:$IOS_VERSION"
          xcrun simctl list runtimes --json | jq -e --arg id "$runtime_id" \
            'any(.runtimes[]; .identifier == $id and .isAvailable == true)' >/dev/null || {
              echo "iOS $IOS_VERSION runtime is unavailable after installation." >&2
              exit 1
            }
        fi
        xcrun simctl list runtimes
    - name: Reuse or create iOS Simulator
      shell: bash
      env:
        IOS_VERSION: ${{ inputs.version }}
        IOS_DEVICE: ${{ inputs.device }}
      run: |
        runtime_id="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
        device_type=$(xcrun simctl list devicetypes --json | jq -er --arg name "$IOS_DEVICE" \
          '.devicetypes[] | select(.name == $name) | .identifier')
        devices=$(xcrun simctl list devices available --json)
        available=$(jq -r --arg runtime "$runtime_id" --arg type "$device_type" --arg name "$IOS_DEVICE" \
          'any(.devices[$runtime][]?; .deviceTypeIdentifier == $type and .name == $name and .isAvailable == true)' <<< "$devices")
        if [[ "$available" == true ]]; then
          echo "Reuse $IOS_DEVICE simulator for iOS $IOS_VERSION."
        else
          xcrun simctl create "$IOS_DEVICE" "$device_type" "$runtime_id"
        fi
        xcrun simctl list devices "$IOS_VERSION"

inputs:
  version:
    description: "iOS Runtime Version"
    required: true
  device:
    description: "iOS Simulator Model"
    required: true

name: Run LLC Tests (Debug)
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 100
    - uses: ./.github/actions/bootstrap
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
        INSTALL_YEETD: true
        INSTALL_SONAR: true
    - name: Run LLC Tests (Debug)
      shell: bash
      run: bundle exec fastlane test device:"$IOS_SIMULATOR_DEVICE" $VERBOSE
      timeout-minutes: 60
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
    - name: Run Sonar analysis
      shell: bash
      run: bundle exec fastlane sonar_upload
      env:
        SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        PR_NUMBER: ${{ github.event.number }}
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-test-llc-debug-${{ github.run_attempt }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      shell: bash
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChat.xcresult fastlane/test_output/logs/
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data LLC
        path: |
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*
    - name: Upload Test Coverage
      uses: actions/upload-artifact@v7
      with:
        name: test-coverage-${{ github.event.pull_request.number }}
        path: reports/sonarqube-generic-coverage.xml

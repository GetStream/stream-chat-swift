name: Test E2E UI (Debug)
inputs:
  batch:
    description: E2E batch index.
    required: true
  launch_id:
    description: Allure launch id. Empty when Allure did not start.
    required: false
    default: ""
  matrix_size:
    description: Number of E2E batches in this run.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: cache-derived-data
        path: derived_data/Build/
    - uses: ./.github/actions/bootstrap
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
        INSTALL_ALLURE: true
        INSTALL_YEETD: true
        SKIP_SWIFT_BOOTSTRAP: true
    - name: Run UI Tests (Debug)
      shell: bash
      run: bundle exec fastlane test_e2e_mock device:"$IOS_SIMULATOR_DEVICE" batch:'${{ inputs.batch }}' test_without_building:true $VERBOSE
      timeout-minutes: 100
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
        LAUNCH_ID: ${{ inputs.launch_id }}
        MATRIX_SIZE: ${{ inputs.matrix_size }}
        STREAM_DEMO_APP_SECRET: ${{ env.STREAM_DEMO_APP_SECRET }}
    - name: Allure TestOps Upload
      if: inputs.launch_id != '' && (success() || failure())
      shell: bash
      run: bundle exec fastlane allure_upload launch_id:"$LAUNCH_ID"
      env:
        ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
        LAUNCH_ID: ${{ inputs.launch_id }}
    - name: Allure TestOps Launch Removal
      if: inputs.launch_id != '' && cancelled()
      shell: bash
      run: bundle exec fastlane allure_launch_removal launch_id:"$LAUNCH_ID"
      env:
        ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
        LAUNCH_ID: ${{ inputs.launch_id }}
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-test-e2e-${{ inputs.batch }}-${{ github.run_attempt }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      shell: bash
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChatUITestsApp.xcresult fastlane/test_output/logs/
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data E2E ${{ inputs.batch }}
        path: |
          fastlane/recordings
          fastlane/stream-chat-test-mock-server/logs/*
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*

name: Automated Code Review
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
      env:
        XCODE_VERSION: "16.1"
    - uses: ./.github/actions/bootstrap
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        INSTALL_INTERFACE_ANALYZER: true
        XCODE_VERSION: "16.1"
    - shell: bash
      run: bundle exec fastlane lint_pr
      env:
        XCODE_VERSION: "16.1"
    - shell: bash
      run: bundle exec fastlane rubocop
      env:
        XCODE_VERSION: "16.1"
    - shell: bash
      run: bundle exec fastlane run_swift_format strict:true
      env:
        XCODE_VERSION: "16.1"
    - shell: bash
      run: bundle exec fastlane validate_public_interface
      env:
        XCODE_VERSION: "16.1"
    - shell: bash
      run: bundle exec fastlane validate_generated_code
      env:
        XCODE_VERSION: "16.1"

name: Test UI (Debug)
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: cache-derived-data
        path: derived_data/Build/
    - uses: ./.github/actions/bootstrap
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
        INSTALL_YEETD: true
        SKIP_SWIFT_BOOTSTRAP: true
    - name: Run UI Tests (Debug)
      shell: bash
      run: bundle exec fastlane test_ui device:"$IOS_SIMULATOR_DEVICE" skip_build:true record:"${{ github.event.inputs.record_snapshots }}" $VERBOSE
      timeout-minutes: 120
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
        GITHUB_TOKEN: ${{ env.DANGER_GITHUB_API_TOKEN }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-test-ui-debug-${{ github.run_attempt }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      shell: bash
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse screenshots fastlane/test_output/StreamChatUI.xcresult fastlane/test_output/snapshots --test
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
        VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data UIKit
        path: |
          fastlane/test_output/snapshots

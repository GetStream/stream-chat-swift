name: Cron Checks

on:
  schedule:
    # Runs "At 03:00 every night except weekends"
    - cron: '0 3 * * 1-5'

  workflow_dispatch:
    inputs:
      mock_server_branch:
        description: 'Mock server branch'
        type: string
        required: true
        default: main
      verbose:
        description: 'Run tests in verbose mode?'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

permissions:
  contents: read
  actions: read # to download the previous e2e coverage map

jobs:
  test-e2e-debug:
    name: Test E2E UI (Debug)
    strategy:
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
            coverage: true # builds the map that selects e2e tests on pull requests
          - ios: "17.5"
            device: "iPhone 15 Pro"
            setup_runtime: true
      fail-fast: false
    runs-on: macos-15
    env:
      GITHUB_EVENT: ${{ toJson(github.event) }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      STREAM_DEMO_APP_SECRET: ${{ secrets.STREAM_DEMO_APP_SECRET }}
      XCODE_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "${{ matrix.device }} (${{ matrix.ios }})"
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_ALLURE: true
        INSTALL_YEETD: true
        INSTALL_IPSW: true
        SKIP_SWIFT_BOOTSTRAP: true
    - uses: ./.github/actions/setup-ios-runtime
      if: ${{ matrix.setup_runtime }}
      timeout-minutes: 60
      with:
        version: ${{ matrix.ios }}
        device: ${{ matrix.device }}
    - name: Launch Allure TestOps
      run: bundle exec fastlane allure_launch cron:true
    - name: Run UI Tests (Debug)
      run: bundle exec fastlane test_e2e_mock device:"${{ env.IOS_SIMULATOR_DEVICE }}" mock_server_branch:${{ inputs.mock_server_branch }} coverage:${{ matrix.coverage == true }} ${{ env.VERBOSE }}
      timeout-minutes: 120
    - uses: actions/upload-artifact@v7
      if: matrix.coverage && (success() || failure())
      with:
        name: e2e-coverage-map
        path: fastlane/test_output/e2e_coverage_map.json
        retention-days: 14
    - name: Allure TestOps Upload
      if: success() || failure()
      run: bundle exec fastlane allure_upload launch_id:"$LAUNCH_ID"
    - name: Allure TestOps Launch Removal
      if: cancelled()
      run: bundle exec fastlane allure_launch_removal launch_id:"$LAUNCH_ID"
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-${{ github.job }}-${{ matrix.ios }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChatUITestsApp.xcresult fastlane/test_output/logs/
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data E2E (iOS ${{ matrix.ios }})
        path: |
          fastlane/recordings
          fastlane/stream-chat-test-mock-server/logs/*
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*

  build-and-test-llc-debug:
    name: Test LLC (Debug)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mock_server_branch == 'main' }}
    strategy:
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          - ios: "16.4"
            device: "iPhone 14 Pro"
            setup_runtime: true
      fail-fast: false
    runs-on: macos-15
    env:
      XCODE_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "${{ matrix.device }} (${{ matrix.ios }})"
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        INSTALL_IPSW: true
    - uses: ./.github/actions/setup-ios-runtime
      if: ${{ matrix.setup_runtime }}
      timeout-minutes: 60
      with:
        version: ${{ matrix.ios }}
        device: ${{ matrix.device }}
    - name: Run LLC Tests (Debug)
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true ${{ env.VERBOSE }}
      timeout-minutes: 100
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-${{ github.job }}-${{ matrix.ios }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChat.xcresult fastlane/test_output/logs/
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data LLC (iOS ${{ matrix.ios }})
        path: |
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*

  build-and-test-common-ui-debug:
    name: Test CommonUI (Debug)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mock_server_branch == 'main' }}
    strategy:
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          - ios: "16.4"
            device: "iPhone 14 Pro"
            setup_runtime: true
      fail-fast: false
    runs-on: macos-15
    env:
      XCODE_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "${{ matrix.device }} (${{ matrix.ios }})"
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        INSTALL_IPSW: true
    - uses: ./.github/actions/setup-ios-runtime
      if: ${{ matrix.setup_runtime }}
      timeout-minutes: 60
      with:
        version: ${{ matrix.ios }}
        device: ${{ matrix.device }}
    - name: Run Common UI Tests (Debug)
      run: bundle exec fastlane test_common_ui device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true ${{ env.VERBOSE }}
      timeout-minutes: 100
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-${{ github.job }}-${{ matrix.ios }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChatCommonUI.xcresult fastlane/test_output/logs/
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data Common UI (iOS ${{ matrix.ios }})
        path: |
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*

  build-and-test-ai-debug:
    name: Test AI (Debug)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mock_server_branch == 'main' }}
    strategy:
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          - ios: "16.4"
            device: "iPhone 14 Pro"
            setup_runtime: true
      fail-fast: false
    runs-on: macos-15
    env:
      XCODE_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "${{ matrix.device }} (${{ matrix.ios }})"
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        INSTALL_IPSW: true
    - uses: ./.github/actions/setup-ios-runtime
      if: ${{ matrix.setup_runtime }}
      timeout-minutes: 60
      with:
        version: ${{ matrix.ios }}
        device: ${{ matrix.device }}
    - name: Run AI Tests (Debug)
      run: bundle exec fastlane test_ai device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true ${{ env.VERBOSE }}
      timeout-minutes: 100
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-${{ github.job }}-${{ matrix.ios }}
        path: ~/Library/Logs/scan/*.log
        if-no-files-found: ignore
    - name: Parse xcresult
      if: failure()
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChatAI.xcresult fastlane/test_output/logs/
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data AI (iOS ${{ matrix.ios }})
        path: |
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*

  build-old-xcode:
    name: Build SDKs (Old Xcode)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mock_server_branch == 'main' }}
    runs-on: macos-14
    env:
      XCODE_VERSION: "16.1"
    steps:
    - name: Connect Bot
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
    - uses: actions/checkout@v7
    - uses: ./.github/actions/xcode-cache
    - uses: ./.github/actions/ruby-cache
    - name: List Xcode versions
      run: mdfind "kMDItemCFBundleIdentifier = 'com.apple.dt.Xcode'"
    - name: Build LLC
      run: bundle exec fastlane test device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25
    - name: Build UI
      run: bundle exec fastlane test_ui device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
    - name: Build Common UI
      run: bundle exec fastlane test_common_ui device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25
    - name: Build AI
      run: bundle exec fastlane test_ai device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25

  automated-code-review:
    name: Automated Code Review
    runs-on: macos-14
    env:
      XCODE_VERSION: "16.1"
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/bootstrap
    - run: bundle exec fastlane rubocop
    - run: bundle exec fastlane run_swift_format strict:true

  slack:
    name: Slack Report
    runs-on: ubuntu-latest
    needs: [build-and-test-llc-debug, build-and-test-common-ui-debug, build-and-test-ai-debug, test-e2e-debug, build-old-xcode, automated-code-review]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
          webhook-type: incoming-webhook
          payload: |
            text: ${{ toJSON('You shall not pass!') }}
            attachments:
              - color: danger
                title: ${{ toJSON(format('{0} failed', github.workflow)) }}
                text: ${{ toJSON(format('Repository: {0} | Commit: {1} | Actor: {2}', github.repository, github.sha, github.actor)) }}
                footer: ${{ toJSON(format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)) }}

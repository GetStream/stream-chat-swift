name: SDK Size

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '**/*.png'

  workflow_dispatch:
    inputs:
      verbose:
        description: 'Run in verbose mode?'
        type: boolean
        required: false
        default: false

  push:
    branches:
      - develop

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  sdk_size:
    name: Size Metrics
    runs-on: macos-15
    env:
      GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      GITHUB_EVENT_AFTER: ${{ github.event.after }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-guard
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ios-certificates
          permission-contents: read

      - name: Pass the bot token to match
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$auth" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ steps.bot-token.outputs.token }}

      - uses: ./.github/actions/bootstrap

      # App tokens last 1 hour, so mint one right before each lane.
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},stream-internal-metrics
          permission-contents: write
          permission-pull-requests: write

      - name: Use release bot token
        run: echo "GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run General SDK Size Metrics
        run: bundle exec fastlane show_frameworks_sizes
        timeout-minutes: 30
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}

      - name: Generate release bot token
        id: app-token-2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},stream-internal-metrics
          permission-contents: write
          permission-pull-requests: write

      - name: Use release bot token
        run: echo "GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ steps.app-token-2.outputs.token }}

      - name: Run Detailed SDK Size Metrics
        run: bundle exec fastlane size_analyze ${{ env.VERBOSE }}
        timeout-minutes: 30

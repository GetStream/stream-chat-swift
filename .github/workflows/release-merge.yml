name: "Merge release"

on:
  issue_comment:
    types: [created]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch release-publish.yml

jobs:
  merge-release-to-main:
    name: Merge release to main
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && github.event.issue.state == 'open' && github.event.comment.body == '/merge release')
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ios-certificates

      - name: Connect Bot
        # Send SSH git URLs (match, metrics) over HTTPS with the token.
        run: >-
          git config --global
          url."https://x-access-token:${TOKEN}@github.com/GetStream/".insteadOf
          "git@github.com:GetStream/"
        env:
          TOKEN: ${{ steps.bot-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ruby-cache

      - name: Merge
        run: bundle exec fastlane merge_release author:"$USER_LOGIN" --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUM: ${{ github.event.issue.number }}
          USER_LOGIN: ${{ github.event.comment.user.login != null && github.event.comment.user.login || github.event.sender.login }}

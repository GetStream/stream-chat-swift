name: "Publish new release"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Publish new release
    runs-on: macos-15
    steps:
      - name: Connect Bot
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ruby-cache

      - name: "Fastlane - Publish Release"
        env:
          GITHUB_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: bundle exec fastlane publish_release --verbose

      - name: Integration Test
        run: | # reports to @support on failure
          test -n "$RELEASE_VERSION"
          gh workflow run test.yml --repo GetStream/apple-internal-testing-pipeline --field sdk=stream-chat-swift --field version="$RELEASE_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}

  merge-main-to-develop:
    name: Merge main to develop
    runs-on: macos-15
    needs: release
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ADMIN_API_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/ruby-cache

      - run: bundle exec fastlane merge_main
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}

      - uses: slackapi/slack-github-action@v4
        if: failure()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: ${{ toJSON('⚠️ <!subteam^S030AAHLDLN>, the merge of `main` to `develop` failed on CI. Consider using this command locally: `bundle exec fastlane merge_main`') }}
            attachments:
              - color: danger
                title: ${{ toJSON(format('{0}: {1} ({2})', github.workflow, github.job, job.status)) }}
                text: ${{ toJSON(format('Repository: {0} | Commit: {1} | Actor: {2}', github.repository, github.sha, github.actor)) }}
                footer: ${{ toJSON(format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)) }}

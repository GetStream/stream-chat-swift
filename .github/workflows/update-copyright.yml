name: Copyright

on:
  schedule:
    # Runs "At 08:00 on day-of-month 1 in January"
    - cron: '0 8 1 1 *'

  workflow_dispatch:

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI

permissions:
  contents: write
  pull-requests: write

jobs:
  copyright:
    name: Copyright
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/ruby-cache
    - name: Generate release bot token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
        permission-contents: read
        permission-pull-requests: write
    - run: bundle exec fastlane copyright
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
    - uses: slackapi/slack-github-action@v4
      if: failure()
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_IOS_BOTS }}
        webhook-type: incoming-webhook
        payload: |
          text: ${{ toJSON('You shall not pass!') }}
          attachments:
            - color: danger
              title: ${{ toJSON(format('{0}: {1} ({2})', github.workflow, github.job, job.status)) }}
              text: ${{ toJSON(format('Repository: {0} | Commit: {1} | Actor: {2}', github.repository, github.sha, github.actor)) }}
              footer: ${{ toJSON(format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)) }}

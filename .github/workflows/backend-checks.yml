name: Backend Checks

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  IOS_SIMULATOR_DEVICE: "iPhone 16 Pro (18.5)"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  actions: write
  contents: read

jobs:
  test-backend-integration:
    name: Test Backend Integration
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        SKIP_SWIFT_BOOTSTRAP: true
    - name: Run UI Tests (Debug)
      run: bundle exec fastlane test_e2e device:"${{ env.IOS_SIMULATOR_DEVICE }}"
      timeout-minutes: 100
    - name: Upload raw Xcode logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: xcode-logs-${{ github.job }}
        path: ~/Library/Logs/scan/*.log
    - name: Parse xcresult
      if: failure()
      run: |
        if [[ ${RUNNER_ENVIRONMENT:-} != self-hosted ]] || ! command -v xcparse >/dev/null; then
          CI=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install chargepoint/xcparse/xcparse
        fi
        xcparse logs fastlane/test_output/StreamChatUITestsApp.xcresult fastlane/test_output/logs/
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Test Data Backend Integration
        path: |
          fastlane/recordings
          fastlane/sinatra_log.txt
          fastlane/test_output/logs/*/Diagnostics/**/*.txt
          fastlane/test_output/logs/*/Diagnostics/simctl_diagnostics/DiagnosticReports/*

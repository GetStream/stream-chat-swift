name: Smoke Checks

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '**/*.png'

  workflow_dispatch:
    inputs:
      record_snapshots:
        description: 'Record snapshots on CI?'
        type: boolean
        required: false
        default: false
      verbose:
        description: 'Run tests in verbose mode?'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
  GITHUB_EVENT_ACTION: ${{ github.event.action }}
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  GITHUB_EVENT_AFTER: ${{ github.event.after }}
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

permissions:
  contents: read
  pull-requests: write
  actions: read # to download the e2e coverage map

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-guard
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-test-app-and-frameworks:
    name: Build Test App and Frameworks
    needs: guard
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Build Test App and Frameworks
      claim: build-test-app-and-frameworks
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/build-test-app-and-frameworks

  automated-code-review:
    name: Automated Code Review
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Automated Code Review
      claim: automated-code-review
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/automated-code-review

  build-old-xcode:
    name: Build SDKs (Old Xcode)
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Build SDKs (Old Xcode)
      claim: build-old-xcode
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/build-old-xcode

  test-llc-debug:
    name: Test LLC (Debug)
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test LLC (Debug)
      claim: test-llc-debug
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-llc-debug

  test-ui-debug:
    name: Test UI (Debug)
    needs:
      - guard
      - build-test-app-and-frameworks
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test UI (Debug)
      claim: test-ui-debug
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-ui-debug

  test-common-ui-debug:
    name: Test Common UI (Debug)
    needs:
      - guard
      - build-test-app-and-frameworks
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test Common UI (Debug)
      claim: test-common-ui-debug
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-common-ui-debug

  test-ai-debug:
    name: Test AI (Debug)
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test AI (Debug)
      claim: test-ai-debug
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-ai-debug

  test-a2ui-debug:
    name: Test A2UI (Debug)
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test A2UI (Debug)
      claim: test-a2ui-debug
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-a2ui-debug

  test-openui-debug:
    name: Test OpenUI (Debug)
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test OpenUI (Debug)
      claim: test-openui-debug
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-openui-debug

  allure_testops_launch:
    name: Launch Allure TestOps
    needs:
      - guard
      - build-test-app-and-frameworks
    if: ${{ github.event.inputs.record_snapshots != 'true' && needs.build-test-app-and-frameworks.outputs.payload != '[]' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Launch Allure TestOps
      claim: allure-testops-launch
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/allure-testops-launch

  test-e2e-debug:
    name: Test E2E UI (Debug)
    needs:
      - guard
      - allure_testops_launch
      - build-test-app-and-frameworks
    if: ${{ github.event.inputs.record_snapshots != 'true' && needs.build-test-app-and-frameworks.outputs.payload != '[]' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.build-test-app-and-frameworks.outputs.payload) }}
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test E2E UI (Debug)
      claim: test-e2e-${{ matrix.batch }}
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-e2e-debug
      work_with: |
        batch: ${{ matrix.batch }}
        launch_id: ${{ needs.allure_testops_launch.outputs.payload }}
        matrix_size: ${{ strategy.job-total }}

  # The number of E2E batches depends on the PR, so branch protection requires this job instead of each batch.
  test-e2e-debug-result:
    name: Test E2E UI (Debug) Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - guard
      - build-test-app-and-frameworks
      - allure_testops_launch
      - test-e2e-debug
    steps:
    - name: Check E2E Results
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "$NEEDS"
        exit 1
      env:
        NEEDS: ${{ toJson(needs) }}

  build-apps:
    name: Build Demo App + Example Apps
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Build Demo App + Example Apps
      claim: build-apps
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/build-apps

  test-integration:
    name: Test Integration
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Test Integration
      claim: test-integration
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/test-integration

  build-tvos:
    name: Build LLC (tvOS)
    needs: guard
    if: ${{ github.event.inputs.record_snapshots != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/runner-pool-mixer.yml
    with:
      name: Build LLC (tvOS)
      claim: build-tvos
      hosts: ${{ github.event.pull_request.head.repo.fork == true && '["macos-15"]' || '["macos-15","stream-macos"]' }}
      work: ./.github/actions/jobs/build-tvos

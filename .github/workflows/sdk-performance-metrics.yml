name: SDK Performance

on:
  schedule:
    # Runs "At 03:00 every night except weekends"
    - cron: '0 3 * * 1-5'

  pull_request:
    types:
      - opened
      - ready_for_review
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '**/*.png'

  workflow_dispatch:
    inputs:
      verbose:
        description: 'Run in verbose mode?'
        type: boolean
        required: false
        default: false

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Guard
    runs-on: { group: github-public-amd64 }
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      actions: write # to cancel skip-ci runs
      checks: read # to skip checks already verified
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ steps.guard.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/ci-guard
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  performance:
    name: Performance Metrics
    runs-on: { group: scaleway-macos }
    needs: guard
    if: ${{ fromJSON(needs.guard.outputs.checks).xcmetrics }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to fetch git tags

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ios-certificates
          permission-contents: read

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12 # gsutil requires Python version 3.8-3.12

      - uses: ./.github/actions/bootstrap
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          INSTALL_GCLOUD: true

      # App tokens last 1 hour, so mint one right before each lane.
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},stream-internal-metrics
          permission-contents: write
          permission-pull-requests: write

      - name: Use release bot token
        run: echo "GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run XCMetrics
        run: bundle exec fastlane xcmetrics ${{ env.VERBOSE }}
        timeout-minutes: 120
        env:
          GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
          MATCH_GIT_TOKEN: ${{ steps.bot-token.outputs.token }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Test Data
          path: |
            derived_data/Build/Products/xcodebuild_output.log
            fastlane/performance/stream-chat-swift.json

name: "Start new release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  test-release:
    name: Start new release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to fetch git tags

      - uses: ./.github/actions/ruby-cache

      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},apple-internal-testing-pipeline,stream-internal-metrics
          permission-contents: read
          permission-pull-requests: write
          permission-actions: write

      - name: Integration Test
        run: gh workflow run test.yml --repo GetStream/apple-internal-testing-pipeline # reports to @support on failure
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create Release PR
        run: bundle exec fastlane release version:"${{ github.event.inputs.version }}" --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
